<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - TUP 44 Farewell</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #FCE7F0; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative overflow-x-hidden text-rose-950">

    <!-- พื้นหลังลายดอกไม้ -->
    <div class="absolute inset-0 z-0 opacity-20 bg-cover bg-center pointer-events-none" style="background-image: url('../assets/flower-bg.png');"></div>

    <!-- Header -->
    <header class="relative z-10 p-6 flex items-center justify-between max-w-6xl mx-auto w-full">
        <a href="../index.html" class="flex items-center space-x-3">
            <img src="../assets/tup_logo.png" alt="TUP Logo" class="w-10 h-10 object-contain drop-shadow-md">
            <span class="text-lg font-bold text-rose-900">TUP 44 Farewell</span>
        </a>
        <a href="../index.html" class="text-rose-800 hover:text-rose-950 text-sm transition font-medium">
            ← กลับหน้าแรก
        </a>
    </header>

    <!-- Main Content (เลย์เอาต์จำลองตาม Canva) -->
    <main class="relative z-10 flex-1 flex flex-col lg:flex-row items-center justify-center px-6 py-8 max-w-6xl mx-auto gap-12 w-full">
        
        <!-- ฝั่งซ้าย: กล่องฟอร์มเข้าสู่ระบบ (สไตล์ Canva) -->
        <div class="bg-[#FFFDF9] border-2 border-rose-200 p-8 rounded-3xl shadow-xl max-w-md w-full backdrop-blur-sm">
            <div class="mb-6">
                <h1 class="text-2xl font-bold text-rose-950 mb-1">เข้าสู่ระบบห้องเรียน</h1>
                <p class="text-rose-700 text-xs">กรอกข้อมูลเพื่อตรวจสอบยอดเงินและส่งสลิป</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-rose-900 mb-1">ชื่อผู้ใช้งาน / เลือกห้องเรียน</label>
                    <select id="roomSelect" class="w-full bg-white border border-rose-300 rounded-xl px-4 py-3 text-rose-950 text-sm focus:outline-none focus:border-rose-500 shadow-inner">
                        <option value="" disabled selected>-- เลือกห้องเรียน (ห้อง 1 - 20) --</option>
                        <script>
                            for(let i = 1; i <= 20; i++) {
                                document.write(`<option value="room${i}">ม.6/${i} (ห้อง ${i})</option>`);
                            }
                        </script>
                        <option value="admin">🔒 แอดมิน (ผู้ดูแลระบบ)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-rose-900 mb-1">รหัสผ่าน</label>
                    <input type="password" id="passwordInput" placeholder="กรอกรหัสผ่านประจำห้อง" class="w-full bg-white border border-rose-300 rounded-xl px-4 py-3 text-rose-950 text-sm focus:outline-none focus:border-rose-500 shadow-inner">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-rose-900 mb-1">ยืนยันรหัสผ่าน</label>
                    <input type="password" id="confirmPasswordInput" placeholder="ยืนยันรหัสผ่านอีกครั้ง" class="w-full bg-white border border-rose-300 rounded-xl px-4 py-3 text-rose-950 text-sm focus:outline-none focus:border-rose-500 shadow-inner">
                </div>

                <button type="submit" class="w-full bg-[#D47A94] hover:bg-[#C26B85] text-white font-semibold py-3.5 rounded-2xl shadow-lg transition duration-200 mt-4 tracking-wide">
                    เข้าสู่ระบบ
                </button>
            </form>
        </div>

        <!-- ฝั่งขวา: รูปภาพและองค์ประกอบสไตล์ Canva -->
        <div class="flex flex-col items-center lg:items-end w-full max-w-lg space-y-4">
            <div class="flex items-center justify-between w-full">
                <div class="text-right w-full">
                    <h2 class="text-2xl font-serif italic text-rose-950 font-bold">First time in</h2>
                    <p class="text-sm font-semibold tracking-widest text-rose-900">TUP 44 FAREWELL</p>
                </div>
                <img src="../assets/phrakiaw.jpeg" alt="พระเกี้ยว" class="w-16 h-16 object-cover rounded-full border-2 border-rose-400 shadow-md ml-4">
            </div>

            <div class="grid grid-cols-2 gap-4 w-full">
                <div class="bg-[#FFFDF9] p-2 border border-rose-300 rounded-2xl shadow-md rotate-1">
                    <img src="../assets/humen.jpeg" alt="กิจกรรม" class="w-full h-36 object-cover rounded-xl">
                </div>
                <div class="bg-[#FFFDF9] p-2 border border-rose-300 rounded-2xl shadow-md -rotate-1">
                    <img src="../assets/monk.jpeg" alt="บรรยากาศ" class="w-full h-36 object-cover rounded-xl">
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="relative z-10 text-center py-6 text-rose-800/70 text-sm border-t border-rose-200/50">
        &copy; 2026 TUP 44 Farewell & Yearbook. All rights reserved.
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const room = document.getElementById('roomSelect').value;
            const pass = document.getElementById('passwordInput').value;

            if(!room) {
                alert('กรุณาเลือกห้องก่อนครับ');
                return;
            }

            if(room === 'admin') {
                if(pass === 'admin1234') {
                    window.location.href = 'admin.html';
                } else {
                    alert('รหัสผ่านแอดมินไม่ถูกต้อง!');
                }
            } else {
                window.location.href = 'room.html?room=' + room;
            }
        });
    </script>

</body>
</html>
