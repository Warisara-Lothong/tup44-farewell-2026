<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUP 44 Farewell & Yearbook 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between relative overflow-x-hidden">

    <div class="absolute inset-0 z-0 opacity-15 bg-cover bg-center pointer-events-none" style="background-image: url('assets/flower-bg.png');"></div>

    <header class="relative z-10 p-6 flex items-center justify-between max-w-6xl mx-auto w-full">
        <div class="flex items-center space-x-3">
            <img src="assets/tup_logo.png" alt="TUP Logo" class="w-12 h-12 object-contain">
            <span class="text-xl font-bold tracking-wider text-pink-400">TUP 44 Farewell</span>
        </div>
        <a href="pages/login.html" class="bg-pink-600 hover:bg-pink-700 text-white px-5 py-2 rounded-full font-medium transition shadow-lg">
            เข้าสู่ระบบ
        </a>
    </header>

    <main class="relative z-10 flex-1 flex flex-col items-center justify-center text-center px-4 py-12 max-w-4xl mx-auto">
        <div class="mb-6">
            <img src="assets/phrakiaw.jpeg" alt="ตราสัญลักษณ์" class="w-28 h-28 object-cover rounded-full mx-auto border-4 border-pink-500 shadow-2xl mb-4">

        <h1 class="text-4xl md:text-6xl font-extrabold mb-4 tracking-tight bg-gradient-to-r from-pink-400 to-purple-400 bg-clip-text text-transparent">
            ยินดีต้อนรับสู่เว็บไซต์อำลา TUP 44

        <p class="text-lg md:text-xl text-slate-300 mb-8 max-w-xl">

        <div class="flex flex-col sm:flex-row gap-4">
            <a href="pages/login.html" class="bg-pink-600 hover:bg-pink-700 text-white font-semibold px-8 py-3.5 rounded-xl shadow-lg transition transform hover:-scale-105">
                🚀 เข้าสู่ระบบ / ส่งสลิปห้องของคุณ
            </a>
        </div>
    </main>

    <footer class="relative z-10 text-center py-6 text-slate-500 text-sm border-t border-slate-900">
        &copy; 2026 TUP 44 Farewell & Yearbook. All rights reserved.
    </footer>
